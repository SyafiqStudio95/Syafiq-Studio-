<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <script src="../runtime.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-800.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05090b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .cam { position: absolute; inset: 0; }
      .cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .layer { position: absolute; inset: 0; z-index: 10; }
      .imgCard { position: absolute; left: 140px; right: 220px; top: 330px; z-index: 6; }
      .imgFrame { width: 100%; aspect-ratio: 3 / 2; border-radius: 30px; overflow: hidden; border: 6px solid #fff;
                   box-shadow: 0 26px 70px rgba(0,0,0,.5); background: #111; }
      .imgFrame img { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 50%; }
      .imgTag { margin: -30px auto 0; position: relative; width: max-content; white-space: nowrap; padding: 14px 26px; border-radius: 999px;
                 background: var(--img-tag-bg, #e8452f); color: #fff; font: 800 40px/1 "Poppins", Arial, sans-serif;
                 box-shadow: 0 12px 28px rgba(0,0,0,.35); }
      .hookcam { z-index: 4; }
      .ovfull { z-index: 2; }
      .pip { position: absolute; top: 300px; width: 330px; z-index: 5; transform-origin: 50% 0%; }
      .pipFrame { position: relative; width: 330px; height: 587px; border-radius: 28px; overflow: hidden;
                  border: 6px solid #fff; box-shadow: 0 24px 60px rgba(0,0,0,.45); background: #000; }
      .pipFrame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .pipTag { margin: -22px auto 0; position: relative; width: max-content; white-space: nowrap; padding: 10px 18px; border-radius: 999px;
                background: var(--pip-tag-bg, #ffd23f); color: var(--pip-tag-ink, #1d1400); font: 800 32px/1 "Poppins", Arial, sans-serif;
                box-shadow: 0 10px 24px rgba(0,0,0,.3); }
      #captions { z-index: 20; }
    </style>
  </head>
  <body>

      <!-- footage: one <video> per kept cut; wrappers carry punch-ins -->

    <script>
